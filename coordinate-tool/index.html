<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 노드 좌표 등록 도구</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            color: #222;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        select, input, button {
            padding: 9px;
            font-size: 14px;
        }

        #map-area {
            border: 1px solid #ccc;
            padding: 10px;
            overflow: auto;
            background: #f7f7f7;
        }

        #floor-map {
            display: block;
            max-width: 100%;
            height: auto;
            margin: auto;
            cursor: crosshair;
        }

        #map-wrapper {
            position: relative;
            display: block;
            width: 100%;
            max-width: 100%;
            margin: auto;
        }

        #markers {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: red;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
        }


        .facility-marker {
            width: 16px;
            height: 16px;
            background: #2563eb;
            border: 2px solid white;
            border-radius: 50%;
        }

        .facility-marker.CAFE {
            background: #16a34a;
        }

        .facility-marker.PRINT {
            background: #d97706;
        }

        .facility-marker.TOILET {
            background: #7c3aed;
        }


        #message {
            margin: 12px 0;
        }

        #coordinates {
            padding: 12px;
            background: #f1f5f9;
            line-height: 1.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        #table-area {
            overflow-x: auto;
        }
    </style>
</head>
<body>
<h1>SVG 노드 좌표 등록 도구</h1>
<p>건물과 층을 선택한 뒤 도면을 클릭해 좌표를 등록하세요. 좌표는 SVG viewBox 기준입니다.</p>

<div class="controls">
    <select id="building">
        <option value="Y05">제5공학관</option>
        <option value="Y09">함박관</option>
        <option value="Y02">창조관</option>
    </select>

    <select id="floor"></select>

        <select id="node-type">
            <option value="ENTRANCE">입구</option>
            <option value="CORRIDOR">복도</option>
            <option value="CLASSROOM">강의실</option>
            <option value="ELEVATOR">엘리베이터</option>
        </select>

    <input id="node-name" placeholder="노드 이름 (선택)">
    <button id="add-node" disabled>좌표 등록</button>
    <button id="download">CSV 저장</button>
    <hr>

    <h2>시설 등록</h2>

    <select id="facility-type">
        <option value="CAFE">카페</option>
        <option value="PRINT">프린터</option>
        <option value="TOILET">화장실</option>
    </select>

    <input id="facility-name" placeholder="시설 이름">
    <input id="facility-code" placeholder="시설 코드">

    <button id="add-facility" disabled>시설 좌표 등록</button>
</div>

<div id="message">도면을 불러오는 중...</div>

<div id="map-area">
    <div id="map-wrapper">
        <img id="floor-map" alt="선택한 층의 SVG 도면">
        <div id="markers"></div>
    </div>
</div>

<div id="coordinates">
    도면을 클릭하면 좌표가 여기에 표시됩니다.
</div>

<h2>등록된 노드</h2>
<div id="table-area">
    <table>
        <thead>
        <tr>
            <th>층</th>
            <th>노드 이름</th>
            <th>종류</th>
            <th>X</th>
            <th>Y</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody id="node-list"></tbody>
    </table>
</div>


<h2>등록된 시설</h2>

<div id="facility-table-area">
    <table>
        <thead>
        <tr>
            <th>층</th>
            <th>시설 코드</th>
            <th>시설 이름</th>
            <th>종류</th>
            <th>X</th>
            <th>Y</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody id="facility-list"></tbody>
    </table>
</div>


<script>
    const floors = {
        Y05: [
            { id: "Y05_1F", name: "1층", file: "5공학관_1F.svg" },
            { id: "Y05_4F", name: "4층", file: "5공학관_4F.svg" }
        ],
        Y09: [
            { id: "Y09_B1F", name: "B1층", file: "함박관_B1F.svg" },
            { id: "Y09_1F", name: "1층", file: "함박관_1F.svg" },
            { id: "Y09_2F", name: "2층", file: "함박관_2F.svg" },
            { id: "Y09_3F", name: "3층", file: "함박관_3F.svg" },
            { id: "Y09_4F", name: "4층", file: "함박관_4F.svg" },
            { id: "Y09_5F", name: "5층", file: "함박관_5F.svg" }
        ],
        Y02: [
            { id: "Y02_4F", name: "4층", file: "창조관_4F.svg" },
            { id: "Y02_5F", name: "5층", file: "창조관_5F.svg" }
        ]
    };

    const buildingSelect = document.getElementById("building");
    const floorSelect = document.getElementById("floor");
    const map = document.getElementById("floor-map");
    const markers = document.getElementById("markers");
    const message = document.getElementById("message");
    const coordinateInfo = document.getElementById("coordinates");
    const addButton = document.getElementById("add-node");
    const addFacilityButton = document.getElementById("add-facility");
    const nodeList = document.getElementById("node-list");
    const facilityList = document.getElementById("facility-list");

    let selectedPoint = null;
    let nodes = [];
    let facilities = [];
    let nextNodeId = 1;
    let loadToken = 0;

    // 좌표 기준 영역. SVG의 viewBox가 있으면 그 값을, 없으면 이미지 원본 크기를 사용한다.
    let box = { minX: 0, minY: 0, width: 0, height: 0 };

    function updateFloors() {
        const buildingId = buildingSelect.value;
        floorSelect.innerHTML = "";

        floors[buildingId].forEach(floor => {
            const option = document.createElement("option");
            option.value = floor.id;
            option.textContent = floor.name;
            floorSelect.appendChild(option);
        });

        loadMap();
    }

    async function readViewBox(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) return null;
            const text = await response.text();
            const doc = new DOMParser().parseFromString(text, "image/svg+xml");
            const svg = doc.documentElement;
            const vb = (svg.getAttribute("viewBox") || "")
                .trim().split(/[\s,]+/).map(Number);
            if (vb.length === 4 && vb.every(Number.isFinite) &&
                vb[2] > 0 && vb[3] > 0) {
                return { minX: vb[0], minY: vb[1], width: vb[2], height: vb[3] };
            }
        } catch (e) {
            // file:// 로 열면 fetch가 막힐 수 있다. 이 경우 이미지 크기로 대체한다.
        }
        return null;
    }

    function loadMap() {
        const buildingId = buildingSelect.value;
        const floorId = floorSelect.value;
        const floor = floors[buildingId].find(item => item.id === floorId);
        const token = ++loadToken;
        const url = "svg/" + floor.file;

        selectedPoint = null;
        addButton.disabled = true;
        addFacilityButton.disabled = true;
        coordinateInfo.textContent =
            "도면을 클릭하면 좌표가 여기에 표시됩니다.";

        box = { minX: 0, minY: 0, width: 0, height: 0 };
        markers.innerHTML = "";
        map.removeAttribute("src");
        message.textContent = "도면을 불러오는 중...";

        map.onload = async () => {
            if (token !== loadToken) return;

            const viewBox = await readViewBox(url);
            if (token !== loadToken) return;

            if (viewBox) {
                box = viewBox;
                message.textContent =
                    "도면을 불러왔습니다. (viewBox 기준 좌표) 원하는 위치를 클릭하세요.";
            } else {
                box = {
                    minX: 0, minY: 0,
                    width: map.naturalWidth,
                    height: map.naturalHeight
                };
                message.textContent =
                    "도면을 불러왔습니다. viewBox를 읽지 못해 이미지 크기 기준으로 좌표를 저장합니다.";
            }
            renderNodes();
        };

        map.onerror = () => {
            if (token !== loadToken) return;
            message.textContent =
                "도면을 불러오지 못했습니다. 파일 이름과 경로를 확인하세요.";
        };

        map.src = url;
    }

    map.addEventListener("click", event => {
        if (!box.width || !box.height) {
            return;
        }

        const rect = map.getBoundingClientRect();

        const x = Math.round(
            box.minX + (event.clientX - rect.left) * box.width / rect.width
        );

        const y = Math.round(
            box.minY + (event.clientY - rect.top) * box.height / rect.height
        );

        selectedPoint = { x, y };
        addButton.disabled = false;
        addFacilityButton.disabled = false;

        coordinateInfo.textContent =
            `선택한 좌표: X = ${x}, Y = ${y}`;
    });


    addButton.addEventListener("click", async () => {
        if (!selectedPoint) return;

        const node = {
            building_id: buildingSelect.value,
            floor_id: floorSelect.value,
            node_name: document.getElementById("node-name").value.trim(),
            node_type: document.getElementById("node-type").value,
            x: selectedPoint.x,
            y: selectedPoint.y
        };

        try {
            const response = await fetch("/api/nodes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(node)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "좌표 저장에 실패했습니다.");
            }

            nodes.push({
                nodeId: result.node_id,
                buildingId: node.building_id,
                floorId: node.floor_id,
                nodeName: node.node_name,
                nodeType: node.node_type,
                x: node.x,
                y: node.y
            });

            renderNodes();

            document.getElementById("node-name").value = "";
            selectedPoint = null;
            addButton.disabled = true;

            coordinateInfo.textContent = "DB 저장 완료! 다음 위치를 클릭하세요.";
        } catch (error) {
            console.error("노드 저장 오류:", error);
            coordinateInfo.textContent = "노드 저장 오류: " + error.message;
        }
    });


    /* 시설 좌표를 데이터베이스에 저장 */
    addFacilityButton.addEventListener("click", async () => {
        if (!selectedPoint) {
            alert("먼저 지도에서 시설 위치를 클릭해 주세요.");
            return;
        }

        const facility = {
            building_id: buildingSelect.value,
            floor_id: floorSelect.value,
            facility_type: document.getElementById("facility-type").value,
            facility_name: document.getElementById("facility-name").value.trim(),
            facility_code: document.getElementById("facility-code").value.trim(),
            x: selectedPoint.x,
            y: selectedPoint.y
        };

        if (!facility.facility_name || !facility.facility_code) {
            alert("시설 이름과 시설 코드를 입력해 주세요.");
            return;
        }

        try {
            const response = await fetch("/api/facilities", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(facility)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "시설 저장에 실패했습니다.");
            }

            alert("시설 좌표가 저장되었습니다!");
            facilities.push({
                facilityId: result.facility_id,
                buildingId: facility.building_id,
                floorId: facility.floor_id,
                facilityType: facility.facility_type,
                facilityName: facility.facility_name,
                facilityCode: facility.facility_code,
                x: facility.x,
                y: facility.y
            });

            renderNodes();

            document.getElementById("facility-name").value = "";
            document.getElementById("facility-code").value = "";

            selectedPoint = null;
            addFacilityButton.disabled = true;

        } catch (error) {
            alert(error.message);
        }
    });




    async function loadSavedNodes() {
        try {
            const response = await fetch("/api/nodes");

            if (!response.ok) {
                throw new Error("서버에서 노드를 불러오지 못했습니다.");
            }

            const data = await response.json();
            const rows = Array.isArray(data) ? data : data.nodes;

            nodes = rows.map(node => ({
                nodeId: node.node_id,
                buildingId: node.building_id,
                floorId: node.floor_id,
                nodeName: node.node_name,
                nodeType: node.node_type,
                x: node.x,
                y: node.y
            }));

            renderNodes();
            message.textContent =
                `DB에서 노드 ${nodes.length}개를 불러왔습니다.`;
        } catch (error) {
            console.error(error);
            message.textContent =
                "노드 불러오기 실패! 서버 실행 상태를 확인하세요.";
        }
    }


    async function loadSavedFacilities() {
        try {
            const response = await fetch("/api/facilities");

            if (!response.ok) {
                throw new Error("시설 정보를 불러오지 못했습니다.");
            }

            const data = await response.json();

            facilities = data.map(facility => ({
                facilityId: facility.facility_id,
                buildingId: facility.building_id,
                floorId: facility.floor_id,
                facilityType: facility.facility_type,
                facilityName: facility.facility_name,
                facilityCode: facility.facility_code,
                x: facility.x,
                y: facility.y
            }));

            renderNodes();

        } catch (error) {
            console.error("시설 불러오기 오류:", error);
            message.textContent = "시설 정보를 불러오지 못했습니다.";
        }
    }


    async function deleteFacility(facilityId) {
        if (!confirm("이 시설을 데이터베이스에서도 삭제할까요?")) {
            return;
        }

        try {
            const response = await fetch(`/api/facilities/${facilityId}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "시설 삭제에 실패했습니다.");
            }

            facilities = facilities.filter(
                facility => facility.facilityId !== facilityId
            );

            renderNodes();
            message.textContent = "시설이 삭제되었습니다.";

        } catch (error) {
            alert(error.message);
        }
    }




    function renderNodes() {
        nodeList.innerHTML = "";
        markers.innerHTML = "";
        facilityList.innerHTML = "";

        if (box.width && box.height) {
            nodes.forEach(node => {
                if (node.floorId !== floorSelect.value) return;

                const marker = document.createElement("div");
                marker.className = "marker";
                marker.style.left =
                    ((node.x - box.minX) / box.width * 100) + "%";
                marker.style.top =
                    ((node.y - box.minY) / box.height * 100) + "%";
                marker.title = node.nodeName || node.nodeType;

                markers.appendChild(marker);
            });
        }

        nodes.forEach((node, index) => {
            const row = document.createElement("tr");

            [
                node.floorId,
                node.nodeName || "-",
                node.nodeType,
                node.x,
                node.y
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actionCell = document.createElement("td");
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "삭제";


            deleteButton.addEventListener("click", async () => {
                const node = nodes[index];

                if (!node) return;

                if (!node.nodeId) {
                    alert("노드 ID를 확인할 수 없습니다.");
                    return;
                }

                if (!confirm("이 노드를 데이터베이스에서도 삭제할까요?")) {
                    return;
                }

                try {
                    const response = await fetch(`/api/nodes/${node.nodeId}`, {
                        method: "DELETE"
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || "노드 삭제에 실패했습니다.");
                    }

                    nodes.splice(index, 1);
                    renderNodes();
                    message.textContent = "노드가 삭제되었습니다.";
                } catch (error) {
                    alert(error.message);
                }
            });


            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);
            nodeList.appendChild(row);
        });


// 현재 층의 시설 표시
        facilities
            .filter(facility =>
                facility.buildingId === buildingSelect.value &&
                facility.floorId === floorSelect.value
            )
            .forEach(facility => {
                const marker = document.createElement("div");

                marker.className = `marker facility-marker ${facility.facilityType}`;
                marker.style.left =
                    ((facility.x - box.minX) / box.width * 100) + "%";

                marker.style.top =
                    ((facility.y - box.minY) / box.height * 100) + "%";
                marker.title = `${facility.facilityName} (${facility.facilityCode})`;

                markers.appendChild(marker);

                const row = document.createElement("tr");

                row.innerHTML = `
            <td>${facility.floorId}</td>
            <td>${facility.facilityCode}</td>
            <td>${facility.facilityName}</td>
            <td>${facility.facilityType}</td>
            <td>${facility.x}</td>
            <td>${facility.y}</td>
            <td>
                <button onclick="deleteFacility(${facility.facilityId})">
                    삭제
                </button>
            </td>
        `;

                facilityList.appendChild(row);
            });

    }

    document.getElementById("download").addEventListener("click", () => {
        if (nodes.length === 0) {
            alert("먼저 좌표를 등록하세요.");
            return;
        }

        const header = [
            "building_id", "floor_id",
            "node_name", "node_type", "x", "y"
        ];

        const escapeCsv = value =>
            '"' + String(value ?? "").replace(/"/g, '""') + '"';

        const rows = nodes.map(node => [
            node.buildingId,
            node.floorId,
            node.nodeName,
            node.nodeType,
            node.x,
            node.y
        ]);

        const csv = [header, ...rows]
            .map(row => row.map(escapeCsv).join(","))
            .join("\r\n");

        const blob = new Blob(
            ["\uFEFF" + csv],
            { type: "text/csv;charset=utf-8;" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "nodes.csv";
        link.click();
        URL.revokeObjectURL(url);
    });

    buildingSelect.addEventListener("change", updateFloors);
    floorSelect.addEventListener("change", loadMap);

    loadSavedNodes();
    loadSavedFacilities();
    updateFloors();
</script>
</body>
</html>
