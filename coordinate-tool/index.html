<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 노드 좌표 등록 도구</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            color: #222;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        select, input, button {
            padding: 9px;
            font-size: 14px;
        }

        #map-area {
            border: 1px solid #ccc;
            padding: 10px;
            overflow: auto;
            background: #f7f7f7;
        }

        #floor-map {
            display: block;
            max-width: 100%;
            height: auto;
            margin: auto;
            cursor: crosshair;
        }

        #map-wrapper {
            position: relative;
            display: block;
            width: 100%;
            max-width: 100%;
            margin: auto;
        }

        #markers {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: red;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
        }

        #message {
            margin: 12px 0;
        }

        #coordinates {
            padding: 12px;
            background: #f1f5f9;
            line-height: 1.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        #table-area {
            overflow-x: auto;
        }
    </style>
</head>
<body>
<h1>SVG 노드 좌표 등록 도구</h1>
<p>건물과 층을 선택한 뒤 도면을 클릭해 좌표를 등록하세요. 좌표는 SVG viewBox 기준입니다.</p>

<div class="controls">
    <select id="building">
        <option value="Y05">제5공학관</option>
        <option value="Y09">함박관</option>
        <option value="Y02">창조관</option>
    </select>

    <select id="floor"></select>

    <select id="node-type">
        <option value="ENTRANCE">입구</option>
        <option value="CORRIDOR">복도</option>
        <option value="CLASSROOM">강의실</option>
        <option value="ELEVATOR">엘리베이터</option>
    </select>

    <input id="node-name" placeholder="노드 이름 (선택)">
    <button id="add-node" disabled>좌표 등록</button>
    <button id="download">CSV 저장</button>
</div>

<div id="message">도면을 불러오는 중...</div>

<div id="map-area">
    <div id="map-wrapper">
        <img id="floor-map" alt="선택한 층의 SVG 도면">
        <div id="markers"></div>
    </div>
</div>

<div id="coordinates">
    도면을 클릭하면 좌표가 여기에 표시됩니다.
</div>

<h2>등록된 노드</h2>
<div id="table-area">
    <table>
        <thead>
        <tr>
            <th>층</th>
            <th>노드 이름</th>
            <th>종류</th>
            <th>X</th>
            <th>Y</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody id="node-list"></tbody>
    </table>
</div>

<script>
    const floors = {
        Y05: [
            { id: "Y05_1F", name: "1층", file: "5공학관_1F.svg" },
            { id: "Y05_4F", name: "4층", file: "5공학관_4F.svg" }
        ],
        Y09: [
            { id: "Y09_B1F", name: "B1층", file: "함박관_B1F.svg" },
            { id: "Y09_1F", name: "1층", file: "함박관_1F.svg" },
            { id: "Y09_2F", name: "2층", file: "함박관_2F.svg" },
            { id: "Y09_3F", name: "3층", file: "함박관_3F.svg" },
            { id: "Y09_4F", name: "4층", file: "함박관_4F.svg" },
            { id: "Y09_5F", name: "5층", file: "함박관_5F.svg" }
        ],
        Y02: [
            { id: "Y02_4F", name: "4층", file: "창조관_4F.svg" },
            { id: "Y02_5F", name: "5층", file: "창조관_5F.svg" }
        ]
    };

    const buildingSelect = document.getElementById("building");
    const floorSelect = document.getElementById("floor");
    const map = document.getElementById("floor-map");
    const markers = document.getElementById("markers");
    const message = document.getElementById("message");
    const coordinateInfo = document.getElementById("coordinates");
    const addButton = document.getElementById("add-node");
    const nodeList = document.getElementById("node-list");

    let selectedPoint = null;
    let nodes = [];
    let nextNodeId = 1;
    let loadToken = 0;

    // 좌표 기준 영역. SVG의 viewBox가 있으면 그 값을, 없으면 이미지 원본 크기를 사용한다.
    let box = { minX: 0, minY: 0, width: 0, height: 0 };

    function updateFloors() {
        const buildingId = buildingSelect.value;
        floorSelect.innerHTML = "";

        floors[buildingId].forEach(floor => {
            const option = document.createElement("option");
            option.value = floor.id;
            option.textContent = floor.name;
            floorSelect.appendChild(option);
        });

        loadMap();
    }

    async function readViewBox(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) return null;
            const text = await response.text();
            const doc = new DOMParser().parseFromString(text, "image/svg+xml");
            const svg = doc.documentElement;
            const vb = (svg.getAttribute("viewBox") || "")
                .trim().split(/[\s,]+/).map(Number);
            if (vb.length === 4 && vb.every(Number.isFinite) &&
                vb[2] > 0 && vb[3] > 0) {
                return { minX: vb[0], minY: vb[1], width: vb[2], height: vb[3] };
            }
        } catch (e) {
            // file:// 로 열면 fetch가 막힐 수 있다. 이 경우 이미지 크기로 대체한다.
        }
        return null;
    }

    function loadMap() {
        const buildingId = buildingSelect.value;
        const floorId = floorSelect.value;
        const floor = floors[buildingId].find(item => item.id === floorId);
        const token = ++loadToken;
        const url = "svg/" + floor.file;

        selectedPoint = null;
        addButton.disabled = true;
        coordinateInfo.textContent =
            "도면을 클릭하면 좌표가 여기에 표시됩니다.";

        box = { minX: 0, minY: 0, width: 0, height: 0 };
        markers.innerHTML = "";
        map.removeAttribute("src");
        message.textContent = "도면을 불러오는 중...";

        map.onload = async () => {
            if (token !== loadToken) return;

            const viewBox = await readViewBox(url);
            if (token !== loadToken) return;

            if (viewBox) {
                box = viewBox;
                message.textContent =
                    "도면을 불러왔습니다. (viewBox 기준 좌표) 원하는 위치를 클릭하세요.";
            } else {
                box = {
                    minX: 0, minY: 0,
                    width: map.naturalWidth,
                    height: map.naturalHeight
                };
                message.textContent =
                    "도면을 불러왔습니다. viewBox를 읽지 못해 이미지 크기 기준으로 좌표를 저장합니다.";
            }
            renderNodes();
        };

        map.onerror = () => {
            if (token !== loadToken) return;
            message.textContent =
                "도면을 불러오지 못했습니다. 파일 이름과 경로를 확인하세요.";
        };

        map.src = url;
    }

    map.addEventListener("click", event => {
        if (!box.width || !box.height) {
            return;
        }

        const rect = map.getBoundingClientRect();

        const x = Math.round(
            box.minX + (event.clientX - rect.left) * box.width / rect.width
        );

        const y = Math.round(
            box.minY + (event.clientY - rect.top) * box.height / rect.height
        );

        selectedPoint = { x, y };
        addButton.disabled = false;

        coordinateInfo.textContent =
            `선택한 좌표: X = ${x}, Y = ${y}`;
    });


    addButton.addEventListener("click", async () => {
        if (!selectedPoint) return;

        const node = {
            building_id: buildingSelect.value,
            floor_id: floorSelect.value,
            node_name: document.getElementById("node-name").value.trim(),
            node_type: document.getElementById("node-type").value,
            x: selectedPoint.x,
            y: selectedPoint.y
        };

        try {
            const response = await fetch("/api/nodes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(node)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "좌표 저장에 실패했습니다.");
            }

            nodes.push({
                nodeId: result.node_id,
                buildingId: node.building_id,
                floorId: node.floor_id,
                nodeName: node.node_name,
                nodeType: node.node_type,
                x: node.x,
                y: node.y
            });

            renderNodes();

            document.getElementById("node-name").value = "";
            selectedPoint = null;
            addButton.disabled = true;

            coordinateInfo.textContent = "DB 저장 완료! 다음 위치를 클릭하세요.";
        } catch (error) {
            console.error("노드 저장 오류:", error);
            coordinateInfo.textContent = "노드 저장 오류: " + error.message;
        }
    });



    async function loadSavedNodes() {
        try {
            const response = await fetch("/api/nodes");

            if (!response.ok) {
                throw new Error("서버에서 노드를 불러오지 못했습니다.");
            }

            const data = await response.json();
            const rows = Array.isArray(data) ? data : data.nodes;

            nodes = rows.map(node => ({
                nodeId: node.node_id,
                buildingId: node.building_id,
                floorId: node.floor_id,
                nodeName: node.node_name,
                nodeType: node.node_type,
                x: node.x,
                y: node.y
            }));

            renderNodes();
            message.textContent =
                `DB에서 노드 ${nodes.length}개를 불러왔습니다.`;
        } catch (error) {
            console.error(error);
            message.textContent =
                "노드 불러오기 실패! 서버 실행 상태를 확인하세요.";
        }
    }


    function renderNodes() {
        nodeList.innerHTML = "";
        markers.innerHTML = "";

        if (box.width && box.height) {
            nodes.forEach(node => {
                if (node.floorId !== floorSelect.value) return;

                const marker = document.createElement("div");
                marker.className = "marker";
                marker.style.left =
                    ((node.x - box.minX) / box.width * 100) + "%";
                marker.style.top =
                    ((node.y - box.minY) / box.height * 100) + "%";
                marker.title = node.nodeName || node.nodeType;

                markers.appendChild(marker);
            });
        }

        nodes.forEach((node, index) => {
            const row = document.createElement("tr");

            [
                node.floorId,
                node.nodeName || "-",
                node.nodeType,
                node.x,
                node.y
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actionCell = document.createElement("td");
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "삭제";

            deleteButton.addEventListener("click", () => {
                nodes.splice(index, 1);
                renderNodes();
            });

            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);
            nodeList.appendChild(row);
        });
    }

    document.getElementById("download").addEventListener("click", () => {
        if (nodes.length === 0) {
            alert("먼저 좌표를 등록하세요.");
            return;
        }

        const header = [
            "building_id", "floor_id",
            "node_name", "node_type", "x", "y"
        ];

        const escapeCsv = value =>
            '"' + String(value ?? "").replace(/"/g, '""') + '"';

        const rows = nodes.map(node => [
            node.buildingId,
            node.floorId,
            node.nodeName,
            node.nodeType,
            node.x,
            node.y
        ]);

        const csv = [header, ...rows]
            .map(row => row.map(escapeCsv).join(","))
            .join("\r\n");

        const blob = new Blob(
            ["\uFEFF" + csv],
            { type: "text/csv;charset=utf-8;" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "nodes.csv";
        link.click();
        URL.revokeObjectURL(url);
    });

    buildingSelect.addEventListener("change", updateFloors);
    floorSelect.addEventListener("change", loadMap);

    loadSavedNodes();
    updateFloors();
</script>
</body>
</html>
